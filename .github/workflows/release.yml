name: Release Windows bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test tools
        shell: powershell
        run: |
          Install-Module Pester -Scope CurrentUser -Force -RequiredVersion 5.7.1
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: powershell
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
      - name: Run Pester
        shell: powershell
        run: Invoke-Pester ./tests -CI

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test tools
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -RequiredVersion 5.7.1
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester ./tests -CI

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        run: bash -n scripts/*.sh
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  package:
    needs: [windows-powershell, powershell, shell]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Windows bundle
        shell: powershell
        run: |
          $name = "wsl-tools-$env:GITHUB_REF_NAME-windows"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item Start-WslTools.cmd, bootstrap.ps1, config.psd1, packages.txt, README.md, LICENSE -Destination $stage
          Copy-Item scripts, docs, state -Destination $stage -Recurse
          $archive = Join-Path $PWD "$name.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
      - name: Upload validated bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-bundle
          path: |
            wsl-tools-${{ github.ref_name }}-windows.zip
            wsl-tools-${{ github.ref_name }}-windows.zip.sha256
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-bundle
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" ./* --verify-tag --generate-notes --title "$TAG"
          fi
